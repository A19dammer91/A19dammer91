<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 572" width="1280" height="572" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Linear Diophantine Systems, Post-Quantum Cryptography and Clock Architecture</title>
  <desc id="d">Banner showing the MRS formula A0 = dr(N) and the RDSI rules: T = q ends a cycle, T = q + 1 starts the next, position(T) = ((T - 1) mod q) + 1, cycles(T) = (T - 1) div q.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="572" fill="#141c2c"/>
  <rect width="1280" height="572" fill="url(#grid)"/>

  <!-- 12-hour dial: positions 1 to 12, no 0 -->
  <g fill="none">
    <circle cx="1130" cy="135" r="88" stroke="#2ec4b6" stroke-width="1.6"/>
    <circle cx="1130" cy="135" r="58" stroke="#e0975a" stroke-width="1.4" stroke-opacity="0.85"/>
    <circle cx="1130" cy="135" r="30" stroke="#e8b866" stroke-width="1.4" stroke-opacity="0.85"/>
  </g>
  <g>
    <circle cx="1130.0" cy="47.0" r="6" fill="#e0975a"/>
    <circle cx="1174.0" cy="58.8" r="3.5" fill="#2ec4b6"/>
    <circle cx="1206.2" cy="91.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1218.0" cy="135.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1206.2" cy="179.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1174.0" cy="211.2" r="3.5" fill="#2ec4b6"/>
    <circle cx="1130.0" cy="223.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1086.0" cy="211.2" r="3.5" fill="#2ec4b6"/>
    <circle cx="1053.8" cy="179.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1042.0" cy="135.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1053.8" cy="91.0" r="3.5" fill="#2ec4b6"/>
    <circle cx="1086.0" cy="58.8" r="3.5" fill="#2ec4b6"/>
    <circle cx="1130" cy="135" r="5" fill="#eef1f7"/>
  </g>
  <text x="1130" y="29" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#e0975a">12</text>
  <text x="1130" y="257" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8794ab">1 … 12, never 0</text>

  <!-- Title -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#eef1f7" font-size="48">
    <tspan x="60" y="104">Linear Diophantine Systems</tspan>
    <tspan x="60" y="162">Post-Quantum Cryptography</tspan>
    <tspan x="60" y="220">&amp; Clock Architecture</tspan>
  </text>
  <text x="60" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#e0975a">From foundational number theory to hybrid unbreakability, and a clock that counts from 1.</text>

  <!-- MRS box -->
  <text x="60" y="312" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3" fill="#2ec4b6">MRS · q = 9</text>
  <rect x="60" y="324" width="540" height="150" rx="10" fill="#141c2c" fill-opacity="0.6" stroke="#e0975a" stroke-width="1.6"/>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#eef1f7">
    <text x="88" y="384">A<tspan font-size="13" dy="5">0</tspan><tspan dy="-5"> = min{ a ∈ ℤ&gt;0 : a ≡ N (mod 9) }</tspan></text>
    <text x="88" y="434">A<tspan font-size="13" dy="5">0</tspan><tspan dy="-5"> = dr(N)</tspan></text>
  </g>

  <!-- RDSI box -->
  <text x="640" y="312" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3" fill="#2ec4b6">RDSI · THE CLOCK · ANY q</text>
  <rect x="640" y="324" width="580" height="150" rx="10" fill="#141c2c" fill-opacity="0.6" stroke="#e0975a" stroke-width="1.6"/>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#eef1f7">
    <text x="668" y="362">T = q</text>
    <text x="668" y="392">T = q + 1</text>
    <text x="668" y="428">position(T) = ((T − 1) mod q) + 1</text>
    <text x="668" y="458">cycles(T)   = (T − 1) div q</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#8794ab">
    <text x="900" y="362">end of a cycle</text>
    <text x="900" y="392">start of the next</text>
  </g>

  <!-- The link between the two boxes -->
  <text x="60" y="510" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#e8b866">dr(N) = ((N − 1) mod 9) + 1 = position(N) when q = 9</text>

  <text x="60" y="548" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="1" fill="#8794ab">Bilal el Issaoui | Amsterdam | 2026</text>
</svg>
