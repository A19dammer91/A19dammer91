<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="bgclip">
      <rect x="0" y="0" width="1080" height="420" />
    </clipPath>
    <clipPath id="meshclip">
      <rect x="700" y="0" width="380" height="300" />
    </clipPath>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="420" fill="#1b2333"/>

  <g clip-path="url(#bgclip)">
    <!-- grid -->
    <g stroke="#3d4d6b" stroke-width="1" opacity="0.6">
      <line x1="40" y1="0" x2="40" y2="420"/>
      <line x1="120" y1="0" x2="120" y2="420"/>
      <line x1="200" y1="0" x2="200" y2="420"/>
      <line x1="280" y1="0" x2="280" y2="420"/>
      <line x1="360" y1="0" x2="360" y2="420"/>
      <line x1="440" y1="0" x2="440" y2="420"/>
      <line x1="520" y1="0" x2="520" y2="420"/>
      <line x1="600" y1="0" x2="600" y2="420"/>
      <line x1="680" y1="0" x2="680" y2="420"/>
      <line x1="760" y1="0" x2="760" y2="420"/>
      <line x1="840" y1="0" x2="840" y2="420"/>
      <line x1="920" y1="0" x2="920" y2="420"/>
      <line x1="1000" y1="0" x2="1000" y2="420"/>
      <line x1="0" y1="40" x2="1080" y2="40"/>
      <line x1="0" y1="100" x2="1080" y2="100"/>
      <line x1="0" y1="160" x2="1080" y2="160"/>
      <line x1="0" y1="220" x2="1080" y2="220"/>
      <line x1="0" y1="280" x2="1080" y2="280"/>
      <line x1="0" y1="340" x2="1080" y2="340"/>
      <line x1="0" y1="400" x2="1080" y2="400"/>
    </g>

    <!-- Matryoshka: 3-layer nested Diophantine decomposition -->
    <!-- kept small and pushed to the top-right corner, clear of all text -->
    <g clip-path="url(#meshclip)">
      <circle cx="970" cy="140" r="70" fill="none" stroke="#3fb6b0" stroke-width="1.6" opacity="0.9"/>
      <circle cx="970" cy="140" r="48" fill="none" stroke="#d9b877" stroke-width="1.6" opacity="0.9"/>
      <circle cx="970" cy="140" r="26" fill="none" stroke="#e0a26a" stroke-width="1.8" opacity="0.95"/>
      <circle cx="970" cy="140" r="5" fill="#f3ede3"/>

      <circle cx="970" cy="70" r="4" fill="#3fb6b0">
        <animate attributeName="r" values="4;6;4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="970" cy="92" r="3.5" fill="#d9b877">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="970" cy="114" r="3" fill="#e0a26a">
        <animate attributeName="r" values="3;5;3" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>

      <!-- recursive pulse: N travels inward, A0 = dr(N) at each ring -->
      <circle r="4.5" fill="#f3ede3">
        <animateMotion dur="3s" repeatCount="indefinite" path="M970,70 L970,140"/>
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="3s" repeatCount="indefinite"/>
      </circle>

      <text x="1002" y="63" font-family="'Courier New', monospace" font-size="12" fill="#3fb6b0">L1</text>
      <text x="1002" y="93" font-family="'Courier New', monospace" font-size="12" fill="#d9b877">L2</text>
      <text x="1002" y="117" font-family="'Courier New', monospace" font-size="12" fill="#e0a26a">L3</text>
    </g>
  </g>

  <!-- title -->
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f3ede3">
    <tspan x="70" dy="0">Linear Diophantine Systems</tspan>
    <tspan x="70" dy="56">&amp; Post-Quantum Cryptography</tspan>
  </text>

  <!-- subtitle -->
  <text x="70" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#e0a26a">
    The MRS Framework: from foundational number theory to hybrid unbreakability.
  </text>

  <!-- caption for the matryoshka diagram, positioned safely below it -->
  <text x="890" y="228" font-family="'Courier New', monospace" font-size="13" fill="#9aa5b6" text-anchor="middle" opacity="0.9">
    depth L = 3
  </text>

  <!-- foundational anchor equations, boxed -->
  <g>
    <rect x="70" y="270" width="480" height="98" rx="6" fill="none" stroke="#d97757" stroke-width="2" filter="url(#softglow)"/>
    <text x="90" y="308" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#f3ede3">
      A&#8320; = min{ a &#8712; &#8484;&gt;0 : a &#8801; N (mod 9) }
    </text>
    <text x="90" y="345" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#f3ede3">
      A&#8320; = dr(N)
    </text>
  </g>

  <!-- footer -->
  <text x="70" y="392" font-family="'Courier New', monospace" font-size="18" fill="#9aa5b6">
    Bilal el Issaoui | Amsterdam | 2026
  </text>
</svg>
